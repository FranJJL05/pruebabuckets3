name: Despliegue prueba S3

on:
  push:
    branches: 
    - develop

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
      - name: Instalar dependencias
        run: npm ci # Instalación necesaria para que Jest funcione
      - name: Ejecutar Pruebas Unitarias
        run: npm run test
        
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Configurar Node.js (Necesario para el 'deploy' job)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # INSTALACIÓN Y JSDOC
      - name: Instalar dependencias para JSDoc
        run: npm ci

      - name: Generar Documentación JSDoc
        run: npm run docs # Esto usa el script corregido que usa 'node'

      # CONFIGURACIÓN DE AWS
      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          # 🚨 ¡USA LA REGIÓN CORRECTA! us-east-1 🚨
          aws-region: us-east-1 

      # DESPLIEGUE A S3 (SIN PARÁMETROS KMS)
      - name: Despliegue de la Aplicación y Documentación a S3
        run: |
          BUCKET=${{ secrets.S3_BUCKET_NAME }}
          
          # Despliega archivos de la aplicación
          aws s3 sync ./ s3://$BUCKET/ --exclude "node_modules/*" --exclude ".git/*" --delete

          # Despliega Documentación JSDoc
          aws s3 sync ./docs/ s3://$BUCKET/docs/ --delete --acl public-read